[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang"
version = "0.0.0+rf.4563778"
description = "Request Forest text serving for Qwen3.6, Qwen3.8, and Ornith"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "aiohttp",
  "anthropic>=0.20.0",
  "apache-tvm-ffi==0.1.11",
  "av==16.1.0 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'armv7l')",
  "blobfile==3.0.0",
  "build",
  "compressed-tensors",
  "cuda-python>=13.0",
  "cuda-tile==1.6.0rc5",
  "datasets",
  "decord2 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'armv7l')",
  "distro",
  "easydict",
  "einops",
  "fastapi",
  "flash-attn-4>=4.0.0b18",
  "flashinfer_python[cu13]==0.6.17",
  "gguf",
  "humming-kernels[cu13]==0.1.12",
  "interegular",
  "IPython",
  "kernels>=0.14.1,<0.15",
  "llguidance>=1.7.6,<2.0.0",
  "mistral_common>=1.11.5",
  "modelscope",
  "msgspec",
  "ninja",
  "numba==0.65.1",
  "numpy",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
  "nvidia-mathdx==25.6.0",
  "nvidia-ml-py",
  "openai==2.6.1",
  "openai-harmony==0.0.4",
  "orjson",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil",
  "py-spy",
  "pybase64",
  "pydantic",
  "python-multipart",
  "pyzmq>=25.1.2",
  "quack-kernels==0.6.4",
  "requests",
  "scipy",
  "sentencepiece",
  "setproctitle",
  "sgl-deep-ep==0.1.2",
  "sgl-deep-gemm==0.1.5.post3",
  "sglang-kernel==0.4.6.post1",
  "smg-grpc-servicer>=0.5.0",
  "soundfile==0.13.1",
  "tiktoken",
  "tilelang==0.1.12",
  "timm==1.0.16",
  "tokenizers==0.22.2",
  "tokenspeed_mla==0.1.8",
  "tomli ; python_version < '3.11'",
  "torch==2.13.0",
  "torch_memory_saver>=0.0.9.post1",
  "torchaudio==2.11.0",
  "torchcodec==0.15.0 ; sys_platform != 'linux' or (sys_platform == 'linux' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')",
  "torchvision",
  "tqdm",
  "transformers==5.12.1",
  "uvicorn",
  "uvloop",
  "watchfiles",
  "xgrammar==0.2.1",
  "xxhash",
  "zstandard",
]

[project.scripts]
sglang = "sglang.cli.main:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = ["sglang*"]
exclude = ["sglang.test*", "sglang.benchmark*", "sglang.multimodal_gen*", "sglang.kernels.aot*"]

[tool.setuptools.package-data]
sglang = ["srt/**/*", "kernels/jit/**/*", "kernels/ops/**/*"]

[tool.setuptools.exclude-package-data]
sglang = ["**/__pycache__/*", "**/*.pyc", "kernels/aot/*", "kernels/aot/**/*"]
